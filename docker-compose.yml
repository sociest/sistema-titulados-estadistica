services:
  db:
    image: postgres:16-alpine
    container_name: sistitulados_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sistitulados_db}
      POSTGRES_USER: ${DB_USER:-seguit_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env - copie .env.example a .env y complete}
    ports:
      - ${DB_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-seguit_app} -d ${DB_NAME:-sistitulados_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - sistitulados_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: sistitulados/app:latest
    container_name: sistitulados_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - ${APP_HOST_PORT:-3001}:3000
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-seguit_app}:${DB_PASSWORD:?Falta DB_PASSWORD en .env - copie .env.example a .env y complete}@db:5432/${DB_NAME:-sistitulados_db}
      SESSION_SECRET: ${SESSION_SECRET:?Falta SESSION_SECRET en .env - copie .env.example a .env y complete}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
      SITIO_URL: ${SITIO_URL:-http://localhost:3001}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      AUTORUN_MIGRATIONS: ${AUTORUN_MIGRATIONS:-true}
      AUTORUN_SEED: ${AUTORUN_SEED:-false}
      HOSTNAME: 0.0.0.0
      PORT: 3000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-}
      KARDEX_SEED_EMAIL: ${KARDEX_SEED_EMAIL:-}
      KARDEX_SEED_PASSWORD: ${KARDEX_SEED_PASSWORD:-}
      TZ: America/La_Paz
    volumes:
      - solicitudes_storage:/app/storage/solicitudes
      - noticias_storage:/app/storage/noticias
    networks:
      - sistitulados_net

volumes:
  postgres_data:
    name: ${PG_VOLUME_NAME:-sistitulados_postgres_data}
  solicitudes_storage: {}

  noticias_storage: {}
networks:
  sistitulados_net:
    driver: bridge
