<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-label="Seguimiento a Titulados">
  <defs>
    <linearGradient id="arrowGradOsc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="cyanLeftOsc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cyanRightOsc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="textShadowOsc" x="-5%" y="-10%" width="112%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#010b19" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Isotipo 3D con borde blanco luminoso sobre fondo transparente para modo oscuro -->
  <g transform="translate(4, 2)">
    <g fill="#ffffff" stroke="#ffffff" stroke-width="15" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="30,84 62,80 112,38 138,58 182,22 173,13 212,10 198,45 190,34 138,76 112,56 68,91 32,94"/>
      <polygon points="34,124 58,113 78,122 82,163 60,174 40,164"/>
      <polygon points="68,94 104,78 132,90 140,170 108,186 80,173"/>
      <polygon points="116,114 148,99 176,112 182,180 152,196 124,182"/>
      <polygon points="158,56 198,38 238,54 232,188 202,206 168,188"/>
    </g>

    <!-- Barra 1: Naranja -->
    <g stroke="#021d3d" stroke-width="3.5" stroke-linejoin="round">
      <polygon points="34,124 58,113 78,122 54,133" fill="#fde047"/>
      <polygon points="34,124 54,133 60,174 40,164" fill="#f97316"/>
      <polygon points="54,133 78,122 82,163 60,174" fill="#c2410c"/>
    </g>

    <!-- Barra 2: Verde lima -->
    <g stroke="#021d3d" stroke-width="3.5" stroke-linejoin="round">
      <polygon points="68,94 104,78 132,90 96,106" fill="#d9f99d"/>
      <polygon points="68,94 96,106 108,186 80,173" fill="#84cc16"/>
      <polygon points="96,106 132,90 140,170 108,186" fill="#4d7c0f"/>
    </g>

    <!-- Barra 3: Rojo -->
    <g stroke="#021d3d" stroke-width="3.5" stroke-linejoin="round">
      <polygon points="116,114 148,99 176,112 144,127" fill="#fca5a5"/>
      <polygon points="116,114 144,127 152,196 124,182" fill="#ef4444"/>
      <polygon points="144,127 176,112 182,180 152,196" fill="#991b1b"/>
    </g>

    <!-- Barra 4: Celeste principal -->
    <g stroke="#021d3d" stroke-width="3.8" stroke-linejoin="round">
      <polygon points="158,56 198,38 238,54 198,72" fill="#e0f2fe"/>
      <polygon points="158,56 198,72 202,206 168,188" fill="url(#cyanLeftOsc)"/>
      <polygon points="198,72 238,54 232,188 202,206" fill="url(#cyanRightOsc)"/>
    </g>

    <!-- Flecha ascendente naranja brillante -->
    <polygon
      points="30,84 62,80 112,38 138,58 182,22 173,13 212,10 198,45 190,34 138,76 112,56 68,91 32,94"
      fill="url(#arrowGradOsc)"
      stroke="#ffffff"
      stroke-width="2"
      stroke-linejoin="round"
    />
  </g>

  <!-- Tipografía institucional blanca de alto contraste -->
  <g fill="#f8fafc" filter="url(#textShadowOsc)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900">
    <text x="262" y="103" font-size="65" letter-spacing="-0.8">SEGUIMIENTO</text>
    <text x="262" y="174" font-size="65" letter-spacing="0.4">A TITULADOS</text>
  </g>
</svg>
